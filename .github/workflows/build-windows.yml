name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check icon catalog
        run: |
          python build_icon_catalog.py
          git diff --exit-code -- icons.json
      - name: Build main application
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "Chibi Crosshair Studio" --add-data "assets;assets" --icon app.ico --distpath Release --workpath build app.pyw
      - name: Build icon updater
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "Chibi Simge Güncelleyici" --icon app.ico --distpath Release --workpath build icon_manager.pyw
      - name: Package programs
        shell: pwsh
        run: Compress-Archive -Path "Release/Chibi Crosshair Studio.exe", "Release/Chibi Simge Güncelleyici.exe", "README.txt" -DestinationPath "Chibi-Crosshair-Studio-Windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Chibi-Crosshair-Studio-Windows
          path: Chibi-Crosshair-Studio-Windows.zip
